name: Build Calculator

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Fetch the TrimUI (tg5040) cross toolchain
        run: git clone --depth 1 https://github.com/shauninman/union-tg5040-toolchain toolchain

      - name: Stage the project inside the toolchain's workspace
        run: |
          mkdir -p toolchain/workspace
          cp -r Calculator toolchain/workspace/Calculator

      - name: Build the toolchain image
        working-directory: toolchain
        run: docker build -t tg5040-toolchain .

      - name: Cross-compile the calculator
        run: |
          set -e
          docker run --rm -v "${{ github.workspace }}/toolchain/workspace:/root/workspace" \
            tg5040-toolchain bash -lc '
              set -e
              for f in ~/.bashrc ~/.bash_profile /setup-env.sh /root/setup-env.sh /opt/setup-env.sh; do
                [ -f "$f" ] && . "$f"
              done
              echo "--- env CC was: $CC ---"
              echo "--- scanning PATH for an ARM/AArch64 cross compiler ---"
              PICKED=""
              for cand in $(compgen -c | grep -i -- "-gcc$" | sort -u); do
                machine=$("$cand" -dumpmachine 2>/dev/null || true)
                echo "candidate: $cand -> $machine"
                case "$machine" in
                  *arm*|*aarch64*)
                    if [ -z "$PICKED" ]; then PICKED="$cand"; fi
                    ;;
                esac
              done
              CC="$PICKED"
              echo "--- Selected CC=$CC ---"
              if [ -z "$CC" ]; then
                echo "No ARM/AArch64 cross compiler found on PATH."
                echo "Full PATH: $PATH"
                echo "Every *gcc* on PATH:"
                compgen -c | grep -i gcc | sort -u
                exit 1
              fi
              cd /root/workspace/Calculator
              make CC="$CC"
              test -f calculator || { echo "make finished but no calculator binary was produced"; exit 1; }
              file calculator
            '

      - name: Confirm we produced an aarch64 binary
        run: |
          test -f toolchain/workspace/Calculator/calculator
          file toolchain/workspace/Calculator/calculator

      - name: Upload the finished app folder
        uses: actions/upload-artifact@v4
        with:
          name: Calculator
          path: toolchain/workspace/Calculator/
