name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build for TrimUI Brick (aarch64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds inside a real aarch64 Debian container under QEMU.
      # Nothing is cross-compiled, so there is no cross toolchain to detect,
      # no dpkg --add-architecture, and no sources.list surgery to get wrong.
      # Bullseye is used on purpose: its glibc (2.31) is old enough that the
      # binary will load on the Brick's firmware.
      - name: Build in aarch64 container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: bullseye
          githubToken: ${{ github.token }}

          dockerRunArgs: |
            --volume "${PWD}:/work"

          install: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              build-essential \
              pkg-config \
              libsdl2-dev

          run: |
            set -e
            cd /work/Calculator
            make clean
            make
            make dist
            echo "--- built binary ---"
            ls -l calculator
            readelf -h calculator | grep -E 'Class|Machine'
            echo "--- shared libraries it expects ---"
            readelf -d calculator | grep NEEDED

      - name: Fix file ownership
        run: sudo chown -R "$USER:$USER" dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BrickCalculator
          path: dist/
          if-no-files-found: error
