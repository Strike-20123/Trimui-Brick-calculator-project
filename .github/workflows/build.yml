name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build for TrimUI Brick (aarch64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in aarch64 container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: bullseye
          githubToken: ${{ github.token }}

          dockerRunArgs: |
            --volume "${PWD}:/work"

          install: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            # Debian 11 reached end of life in Aug 2026 and has moved to
            # archive.debian.org. The normal mirrors now 404 on bullseye-security.
            cat > /etc/apt/sources.list <<'SOURCES'
            deb http://archive.debian.org/debian bullseye main
            deb http://archive.debian.org/debian-security bullseye-security main
            SOURCES
            rm -f /etc/apt/sources.list.d/*.list || true

            # The archive's Release files are past their Valid-Until date by design
            echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
            echo 'Acquire::Retries "5";' >> /etc/apt/apt.conf.d/99archive

            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential \
              pkg-config \
              libsdl2-dev

          run: |
            set -e
            cd /work/Calculator
            make clean
            make
            make dist
            echo "--- built binary ---"
            ls -l calculator
            readelf -h calculator | grep -E 'Class|Machine'
            echo "--- shared libraries it expects ---"
            readelf -d calculator | grep NEEDED

      - name: Fix file ownership
        run: sudo chown -R "$USER:$USER" dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BrickCalculator
          path: dist/
          if-no-files-found: error
